name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Linux ${{ matrix.arch }} · amc ${{ matrix.amc-tag }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 (servers) + arm64 (Raspberry Pi / Apple-silicon CI
        # runners). Both Linux → same apt + bash run_tests.sh + redis
        # service path. ubuntu-24.04-arm is the free native arm64 runner.
        #
        # Each platform is a full `include` entry (carrying its own
        # amc-tag) rather than an `amc-tag` axis + extending includes —
        # the latter collapses both arch entries onto the single
        # amc-tag combination, so only the last (arm64) would run.
        #
        # amc-tag v0.8.72 = the declared required-amalgame floor:
        # v0.20.0's SessionStore is an amc interface value needing
        # interface dispatch (landed v0.8.72); the old v0.8.58 floor
        # segfaulted on WithSession and had been red since v0.20.0.
        include:
          - { arch: x86_64, runner: ubuntu-latest,    amc-tag: v0.8.72 }
          - { arch: arm64,  runner: ubuntu-24.04-arm, amc-tag: v0.8.72 }
    services:
      # v0.8.4+: redis_session_test exercises RedisSessionStore
      # against a live RESP2 server. The test SKIPs cleanly when no
      # server is reachable, but in CI we want the live path covered.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      # Check out amalgame-web inside `web/` so the sibling
      # amalgame-net-http checkout can live next to it (matches the
      # local-dev layout the test runner falls back to).
      - uses: actions/checkout@v4
        with:
          path: web

      # v0.3.0+: tests/router_test.am imports `Amalgame.Net.Http` for
      # HttpResponse (the typed Closure<WebContext, HttpResponse>
      # Handler signature). Checkout the sibling repo so the test
      # runner picks it up via the `$AMALGAME_NET_HTTP` env override
      # set below.
      - uses: actions/checkout@v4
        with:
          repository: amalgame-lang/amalgame-net-http
          ref: v0.14.1
          path: amalgame-net-http

      # v0.17.0+: OAuth2Client hits HTTPS endpoints via
      # HttpClient (net-http v0.11+) → needs amalgame-tls's
      # runtime header in the gcc -I path.
      - uses: actions/checkout@v4
        with:
          repository: amalgame-lang/amalgame-tls
          ref: v0.3.0
          path: amalgame-tls

      # v0.6.0+: RateLimit uses `DateTime.NowMonotonicNanos()` from
      # amalgame-datetime. Same sibling-checkout pattern.
      - uses: actions/checkout@v4
        with:
          repository: amalgame-lang/amalgame-datetime
          ref: v0.1.0
          path: amalgame-datetime

      # v0.7.1+: Csrf uses `Random.SystemBytes()` from amalgame-random
      # for crypto-grade CSRF token entropy. Same sibling-checkout pattern.
      - uses: actions/checkout@v4
        with:
          repository: amalgame-lang/amalgame-random
          ref: v0.1.0
          path: amalgame-random

      # v0.8.2+: LogConfig + WebApp.WithLogging use amalgame-logging.
      - uses: actions/checkout@v4
        with:
          repository: amalgame-lang/amalgame-logging
          ref: v0.1.0
          path: amalgame-logging

      # v0.8.3+: SignedCookieSessionStore uses amalgame-crypto (Hmac).
      - uses: actions/checkout@v4
        with:
          repository: amalgame-lang/amalgame-crypto
          ref: v0.3.0
          path: amalgame-crypto

      # v0.8.4+: RedisSessionStore uses amalgame-database-nosql-redis
      # (C-only package consumed via AMALGAME_PACKAGES_DIR + a
      # transient amalgame.lock — wired in tests/run_tests.sh).
      - uses: actions/checkout@v4
        with:
          repository: amalgame-lang/amalgame-database-nosql-redis
          ref: v0.3.0
          path: amalgame-database-nosql-redis

      # v0.9.2+: MemorySessionStore + RateLimit use amalgame-threading
      # for per-instance mutex. Same C-only fake-cache pattern as Redis.
      - uses: actions/checkout@v4
        with:
          repository: amalgame-lang/amalgame-threading
          ref: v0.1.0
          path: amalgame-threading

      # v0.12.0+: WebApp.ServeAsync routes through amalgame-net-http
      # v0.9.1+'s Http1.ServeAsync, which #includes Amalgame_Async.h
      # unconditionally. C-only package, same fake-cache pattern.
      - uses: actions/checkout@v4
        with:
          repository: amalgame-lang/amalgame-async
          ref: v0.2.2
          path: amalgame-async

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgc-dev libssl-dev libcurl4-openssl-dev libnghttp2-dev

      - name: Download amc ${{ matrix.amc-tag }}
        run: |
          set -e
          TAG="${{ matrix.amc-tag }}"
          VERSION="${TAG#v}"
          curl -sSL -o amc.tar.gz \
            "https://github.com/amalgame-lang/Amalgame/releases/download/${TAG}/amc-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p $RUNNER_TEMP/amc-install
          tar -xzf amc.tar.gz -C $RUNNER_TEMP/amc-install --strip-components=1
          echo "AMC=$RUNNER_TEMP/amc-install/bin/amc" >> $GITHUB_ENV
          echo "AMC_RUNTIME=$RUNNER_TEMP/amc-install/share/amalgame/runtime" >> $GITHUB_ENV

      - name: Run tests
        working-directory: web
        env:
          AMALGAME_NET_HTTP: ${{ github.workspace }}/amalgame-net-http
          AMALGAME_TLS:      ${{ github.workspace }}/amalgame-tls
          AMALGAME_DATETIME: ${{ github.workspace }}/amalgame-datetime
          AMALGAME_RANDOM:   ${{ github.workspace }}/amalgame-random
          AMALGAME_LOGGING:  ${{ github.workspace }}/amalgame-logging
          AMALGAME_CRYPTO:   ${{ github.workspace }}/amalgame-crypto
          AMALGAME_DB_REDIS: ${{ github.workspace }}/amalgame-database-nosql-redis
          AMALGAME_THREADING: ${{ github.workspace }}/amalgame-threading
          AMALGAME_ASYNC:     ${{ github.workspace }}/amalgame-async
        run: ./tests/run_tests.sh "$AMC"

  # macOS / Windows — best-effort toolchain smoke. The full test runner
  # (tests/run_tests.sh) is Linux-only today: it shells apt + hardcodes
  # the gcc link flags for libssl / libnghttp2 / libgc with no per-OS
  # prefix handling. Porting it (brew prefixes on macOS, an MSYS2 bash
  # toolchain on Windows) is tracked separately. Until then we at least
  # prove the released amc binary runs on these platforms. Non-blocking
  # (continue-on-error) so the matrix advertises the targets without
  # gating the build on the not-yet-ported runner.
  smoke-other-os:
    name: ${{ matrix.label }} · amc smoke (best-effort)
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: macOS arm64,    runner: macos-latest,   amc_os: macos-arm64,    ext: tar.gz }
          - { label: Windows x86_64, runner: windows-latest, amc_os: windows-x86_64, ext: zip }
    steps:
      - name: Download + run amc ${{ matrix.amc_os }}
        shell: bash
        run: |
          set -e
          # macOS amc dynamically links bdw-gc (libgc.1.dylib from the
          # Homebrew prefix); install it so `amc --version` can load.
          # Windows builds bundle their deps — nothing to install.
          if [ "$RUNNER_OS" = "macOS" ]; then brew install bdw-gc >/dev/null; fi
          TAG="v0.8.72"
          VERSION="${TAG#v}"
          URL="https://github.com/amalgame-lang/Amalgame/releases/download/${TAG}/amc-${VERSION}-${{ matrix.amc_os }}.${{ matrix.ext }}"
          curl -sSL -o amc-archive "$URL"
          mkdir -p amc-install
          if [ "${{ matrix.ext }}" = "zip" ]; then
            unzip -q amc-archive -d amc-install
          else
            tar -xzf amc-archive -C amc-install --strip-components=1
          fi
          AMC="$(find amc-install -name 'amc' -o -name 'amc.exe' | head -1)"
          echo "amc binary: $AMC"
          "$AMC" --version
