# amalgame-web — Mosaic web framework runtime library.
#
# This package is the LIBRARY half of the Mosaic web stack:
#   - Router with `:param` + `*splat` matching
#   - Route + RouteMatch
#   - Session + MemorySessionStore
#   - WebContext (per-request bag)
#   - SecurityHeaders (response-side hardening — v0.4.0)
#   - Cors (cross-origin resource sharing — v0.5.0)
#   - RateLimit (fixed-window per-key throttle — v0.6.0, uses amalgame-datetime)
#   - Csrf (double-submit cookie CSRF guard — v0.7.0, uses amalgame-random)
#   - WebApp (orchestrator chaining all middlewares — v0.8.0)
#   - Static (file-serving middleware — v0.13.0)
#   - Access log enriched + on every path (static/reject too — v0.18.0)
#
# The BUILD TOOL (filesystem routing, Next.js App Router style,
# DEV mode, scaffolding) is a separate project — install it once
# from the mosaic repo:
#
#   curl -sSL https://raw.githubusercontent.com/amalgame-lang/mosaic/main/install.sh | bash
#
# See https://github.com/amalgame-lang/mosaic
#
# Install (library only):
#   amc package add tls          # for HTTPS
#   amc package add net-http     # HTTP/1.1 parser + types + h2c
#   amc package add web          # this package

[package]
name              = "amalgame-web"
version           = "0.36.2"
license           = "Apache-2.0"
description       = "Mosaic — the Amalgame web framework runtime library. v0.36.1 fixes HEAD request handling (RFC 7231 §4.3.2): a HEAD now falls back to the matching GET route (instead of 404ing on GET-only routes such as a static site index) and the response body is stripped at the single dispatch exit, so HEAD returns the same status + headers as GET with no body — health-checkers / monitors / `curl -I` get a correct 200 instead of a spurious 404. v0.36.0 adds a typed input Validator (defence-in-depth between raw client bytes and handler logic): declare rules per field — Required/Optional, Int/Float/Bool/Email types with strict parsing, Range, MinLen/MaxLen, OneOf allow-lists, Alnum/Alpha/Numeric char classes — then v.Check(map) returns a ValidationResult with per-field errors + normalised typed accessors (IntOf/BoolOf/Of) and an ErrorJson() body for a 422. SECURITY: every accepted field is length-bounded (an 8 KiB default cap even without MaxLen — anti-DoS), control-character-free (C0/DEL rejected unless AllowMultiline — shuts header/log injection + NUL truncation), strictly typed (\"12abc\" is not an int), and optionally allow-listed (the strongest anti-injection control). The validator is pure — it parses + checks, never executes. v0.35.0 completes the OAuth2 client into a full OpenID Connect relying party: OAuth2Client.WithOidc(issuer) makes HandleCallback cryptographically verify the id_token returned by the token endpoint — RS256 signature against the IdP's JWKS (fetched via the pinned jwks_uri or OIDC discovery), with hard checks on iss / aud / exp and a one-time nonce minted in StartLogin (replay defence). SECURITY: the alg is hard-pinned to RS256 (alg=none and any HS* are rejected before signature work — defeats the JWKS-as-HMAC-secret algorithm-confusion attack), the JWKS key is built verify-only (JwsKey.FromJwkRsa, never a signer), and the flow fails CLOSED — a missing/invalid id_token aborts the callback rather than trusting an unverified userinfo identity. The verified id_token claims are authoritative (sub/email/name). VerifyIdTokenJwks(idToken, jwksJson, nonce) exposes the network-free verifier for cached-JWKS / testing. Validated by a self-signed RS256 round-trip + negative tests (nonce, audience, issuer, tampered payload, alg confusion). Google's preset pre-wires the issuer + JWKS so WithOidc() needs no argument. v0.34.0 adds PKCE (RFC 7636, S256) to the OAuth2 client: OAuth2Client.WithPkce() makes StartLogin send a code_challenge (base64url(SHA-256(verifier))) + code_challenge_method=S256 and stash the code_verifier in the state cookie, and HandleCallback replay it in the token exchange — defending the authorization-code flow against interception. Opt-in (the non-PKCE flow is unchanged); challenge matches the RFC 7636 Appendix B vector. v0.33.0 adds built-in observability: WithObservability(Observability.New()) exposes /healthz + /readyz (public liveness/readiness probes) and /metrics in Prometheus exposition format (request counters by status class, total, in-flight gauge, duration sum), with thread-safe counters for ServeMt. SECURITY: /metrics is private-by-default — served only to loopback/RFC1918/ULA source addresses, or with a bearer token (WithMetricsToken); an unauthorized caller gets a 404 indistinguishable from a missing route, so the endpoint isn't disclosed. v0.32.0 adds per-request CSP nonces for a strict Content-Security-Policy without 'unsafe-inline': SecurityHeaders.WithCspNonce() emits script-src 'self' 'nonce-…', WebApp generates a fresh nonce each request and exposes it as ctx.CspNonce (stamp it on inline <script nonce> tags / pass to the template), tying the response policy to the nonce the handler used. v0.31.0 adds LoginGuard, a brute-force / credential-stuffing lockout for auth endpoints: count FAILED attempts per identity (IP / username) and lock that key out (429 + Retry-After) after N failures within a window — the app drives RecordFailure/RecordSuccess around its own credential check, so it works with any auth scheme. v0.30.0 adds a Host header allow-list (WithHostGuard / HostGuard.New().Allow(host)) that 400s forged/unknown Host headers — defending against cache poisoning, password-reset/link forgery, and DNS-rebinding — and sanitizes CR/LF out of request-derived access-log fields (Host/path/method) to stop log injection. v0.29.0 hardens security: static serving denies dotfiles (.git/.env/.htpasswd — while keeping /.well-known reachable for ACME) and .am/.lock source/lock files, and blocks symlink escapes from the served root via realpath(3) containment; the template engine adds context-aware escaping filters ({{x|js}} / {{x|attr}} / {{x|url}}, default stays HTML, unknown filter fails safe to HTML) so values placed in JavaScript / HTML-attribute / URL contexts are no longer XSS-able. v0.28.0 adds Server-Sent Events: WebApp.Sse(path, handler) registers a streaming route whose handler holds the connection and pushes events via net-http's SseConn (live push without WebSocket). v0.27.0 upgrades static file serving: Last-Modified + If-Modified-Since (304), HTTP Range requests (206 Partial Content / 416), and pre-compressed .gz variant selection when the client accepts gzip. v0.26.0 adds a gzip Compression middleware (WithCompress, opt-in, handler-wins) — gzips eligible text responses when the client sends Accept-Encoding: gzip (via amalgame-compress). v0.25.0 surfaces multipart/form-data uploads in handlers: WebContext.Multipart() / IsMultipart() (parser lives in net-http v0.14.1, binary-safe). v0.24.0 adds a pure-Amalgame template engine (Template, Mustache-like) with HTML auto-escape by default — `{{x}}` is escaped, `{{{x}}}` opts out — closing the XSS gap left by HttpResponse.Html(); WebContext.Render(path, data) / RenderString render straight to an HTML response. v0.23.0 adds MosaicServer.AddHandler: mount a raw HttpRequest→HttpResponse closure (e.g. a reverse proxy / load balancer) on a host, sharing the same Host dispatch + SNI + :80→:443 machinery as WebApp sites — keeps amalgame-web proxy-agnostic (the caller wires amalgame-net-proxy). v0.22.0 adds MosaicServer: a multi-site, multi-domain HTTPS front (Host dispatch + SNI + :80→:443 redirect) — the reusable core behind a config-driven `mosaic serve`. v0.21.0 advertises the stack by default (X-Powered-By + Server). v0.20.0 automatic sessions (WithSession + SessionStore interface). v0.19.0 first-class auth (WithBasicAuth / WithJwt + Protected()). Requires net-http v0.13.6+ (SNI + keep-alive)."
required-amalgame = ">=0.8.72"
schema-version    = 1

# Runtime deps on other Amalgame packages. amc >= 0.8.39 auto-pulls
# these recursively on `amc package add web`.
[dependencies]
amalgame-tls                    = ">=0.3.1"
amalgame-net-http               = ">=0.16.0"
amalgame-crypto                 = ">=0.6.0"
amalgame-datetime               = ">=0.2.2"
amalgame-random                 = ">=0.1.0"
amalgame-logging                = ">=0.2.0"
amalgame-database-nosql-redis   = ">=0.3.0"
amalgame-threading              = ">=0.1.0"
# v0.12.0: amalgame-net-http v0.9.2 brings Http1.ServeAsync in,
# which transitively requires amalgame-async ≥ 0.2.0. Declared
# here for the dep solver — also picked up automatically via the
# net-http manifest, but explicit beats implicit.
amalgame-async                  = ">=0.2.2"
# v0.26.0: gzip Compression middleware.
amalgame-compress               = ">=0.1.0"

[stdlib]
classes   = [
    "Router",
    "Route",
    "RouteMatch",
    "Session",
    "MemorySessionStore",
    "Template",
    "WebContext",
    "SecurityHeaders",
    "Cors",
    "RateLimitBucket",
    "RateLimit",
    "Csrf",
    "WebApp",
    "LogConfig",
    "SignedCookieSessionStore",
    "RedisSessionStore",
    "AcmeConfig",
    "TlsBindingConfig",
    "Static",
    "PoweredBy",
    "Compression",
    "SseRoute",
    "MosaicServer",
    "ValidationResult",
    "FieldRule",
    "Validator",
]
header    = "runtime/Amalgame_Web.h"
namespace = "Amalgame.Web"
facade    = "facade.am"
# Multi-file split (v0.7.x). facade.am holds the routing core
# (Route / RouteMatch / Router); each middleware lives in its own
# source. Order matters for cross-file references: session.am
# before web_context.am (WebContext.Session field), and so on.
sources   = [
    "session.am",
    "template.am",
    "web_context.am",
    "security_headers.am",
    "cors.am",
    "rate_limit.am",
    "login_guard.am",
    "csrf.am",
    "log_config.am",
    "signed_cookie_session.am",
    "redis_session.am",
    "acme_config.am",
    "tls_binding_config.am",
    "basic_auth.am",
    "jwt_auth.am",
    "oauth2.am",
    "static.am",
    "powered_by.am",
    "compress.am",
    "sse_route.am",
    "host_guard.am",
    "observability.am",
    "validation.am",
    "web_app.am",
    "mosaic_server.am",
]
libs      = []
