# amalgame-web — Mosaic web framework runtime library.
#
# This package is the LIBRARY half of the Mosaic web stack:
#   - Router with `:param` + `*splat` matching
#   - Route + RouteMatch
#   - Session + MemorySessionStore
#   - WebContext (per-request bag)
#   - SecurityHeaders (response-side hardening — v0.4.0)
#   - Cors (cross-origin resource sharing — v0.5.0)
#   - RateLimit (fixed-window per-key throttle — v0.6.0, uses amalgame-datetime)
#   - Csrf (double-submit cookie CSRF guard — v0.7.0, uses amalgame-random)
#   - WebApp (orchestrator chaining all middlewares — v0.8.0)
#   - Static (file-serving middleware — v0.13.0)
#
# The BUILD TOOL (filesystem routing, Next.js App Router style,
# DEV mode, scaffolding) is a separate project — install it once
# from the mosaic repo:
#
#   curl -sSL https://raw.githubusercontent.com/amalgame-lang/mosaic/main/install.sh | bash
#
# See https://github.com/amalgame-lang/mosaic
#
# Install (library only):
#   amc package add tls          # for HTTPS
#   amc package add net-http     # HTTP/1.1 parser + types + h2c
#   amc package add web          # this package

[package]
name              = "amalgame-web"
version           = "0.13.3"
license           = "Apache-2.0"
description       = "Mosaic — the Amalgame web framework runtime library."
required-amalgame = ">=0.8.50"
schema-version    = 1

# Runtime deps on other Amalgame packages. amc >= 0.8.39 auto-pulls
# these recursively on `amc package add web`.
[dependencies]
amalgame-tls                    = ">=0.3.1"
amalgame-net-http               = ">=0.9.6"
amalgame-crypto                 = ">=0.3.0"
amalgame-datetime               = ">=0.1.0"
amalgame-random                 = ">=0.1.0"
amalgame-logging                = ">=0.1.0"
amalgame-database-nosql-redis   = ">=0.3.0"
amalgame-threading              = ">=0.1.0"
# v0.12.0: amalgame-net-http v0.9.2 brings Http1.ServeAsync in,
# which transitively requires amalgame-async ≥ 0.2.0. Declared
# here for the dep solver — also picked up automatically via the
# net-http manifest, but explicit beats implicit.
amalgame-async                  = ">=0.2.2"

[stdlib]
classes   = [
    "Router",
    "Route",
    "RouteMatch",
    "Session",
    "MemorySessionStore",
    "WebContext",
    "SecurityHeaders",
    "Cors",
    "RateLimitBucket",
    "RateLimit",
    "Csrf",
    "WebApp",
    "LogConfig",
    "SignedCookieSessionStore",
    "RedisSessionStore",
    "AcmeConfig",
    "TlsBindingConfig",
    "Static",
]
header    = "runtime/Amalgame_Web.h"
namespace = "Amalgame.Web"
facade    = "facade.am"
# Multi-file split (v0.7.x). facade.am holds the routing core
# (Route / RouteMatch / Router); each middleware lives in its own
# source. Order matters for cross-file references: session.am
# before web_context.am (WebContext.Session field), and so on.
sources   = [
    "session.am",
    "web_context.am",
    "security_headers.am",
    "cors.am",
    "rate_limit.am",
    "csrf.am",
    "log_config.am",
    "signed_cookie_session.am",
    "redis_session.am",
    "acme_config.am",
    "tls_binding_config.am",
    "static.am",
    "web_app.am",
]
libs      = []
